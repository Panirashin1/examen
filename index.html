<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complejo Deportivo - Inicio de sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tennis-ball"></i> COMPLEJO DEPORTIVO</h1>
        </header>
        
        <main class="form-container">
            <div class="form-card">
                <h2>Iniciar sesión</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" required placeholder="ejemplo@correo.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" required>
                    </div>
                    
                    <div class="form-options">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember">
                            <label for="remember">Iniciar sesión</label>
                        </div>
                        
                        <div class="checkbox-group">
                            <input type="checkbox" id="register">
                            <label for="register">Registrarme</label>
                        </div>
                    </div>
                    
                    <button type="button" class="btn btn-primary" onclick="login()">Iniciar sesión</button>
                    
                    <div class="form-links">
                        <a href="#" onclick="showForgotPassword()">Olvidaste tu contraseña</a>
                        <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
                    </div>
                </form>
            </div>
        </main>
        
        <footer>
            <p>© 2023 Complejo Deportivo. Todos los derechos reservados.</p>
        </footer>
    </div>
    
    <!-- Modal para recuperar contraseña -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeForgotPassword()">&times;</span>
            <h3>Recuperar contraseña</h3>
            <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
            <div class="form-group">
                <label for="recoveryEmail">Correo electrónico:</label>
                <input type="email" id="recoveryEmail" placeholder="ejemplo@correo.com">
            </div>
            <button class="btn btn-primary" onclick="sendRecoveryEmail()">Enviar enlace</button>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
