    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complejo Deportivo - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tennis-ball"></i> COMPLEJO DEPORTIVO</h1>
        </header>
        
        <main class="form-container">
            <div class="form-card">
                <h2>REGISTRO DE NUEVO USUARIO</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="firstName">Nombre:</label>
                        <input type="text" id="firstName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Apellido:</label>
                        <input type="text" id="lastName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="registerEmail">Email:</label>
                        <input type="email" id="registerEmail" required placeholder="ejemplo@correo.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Domicilio:</label>
                        <input type="text" id="address" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="age">Edad:</label>
                        <input type="number" id="age" min="1" max="120" required>
                    </div>
                    
                    <hr class="separator">
                    
                    <div class="form-links">
                        <p>¿Ya tienes una cuenta? <a href="index.html">Iniciar sesión</a></p>
                    </div>
                    
                    <button type="button" class="btn btn-primary" onclick="register()">Registrarme</button>
                </form>
            </div>
        </main>
        
        <footer>
            <p>© 2023 Complejo Deportivo. Todos los derechos reservados.</p>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
