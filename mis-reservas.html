<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complejo Deportivo - Mis Reservas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-nav">
                <h1><i class="fas fa-tennis-ball"></i> COMPLEJO DEPORTIVO</h1>
                <nav>
                    <a href="index.html"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                    <a href="reservas.html"><i class="fas fa-calendar-plus"></i> Nueva Reserva</a>
                </nav>
            </div>
        </header>
        
        <main>
            <div class="page-header">
                <h2>MIS RESERVAS</h2>
            </div>
            
            <div class="content-card">
                <div class="reservations-list">
                    <div class="reservation-item">
                        <div class="reservation-header">
                            <h3><i class="fas fa-tennis-ball"></i> Cancha 1</h3>
                            <button class="btn-cancel" onclick="cancelReservation(1)">X</button>
                        </div>
                        <div class="reservation-details">
                            <p><i class="fas fa-calendar-day"></i> 12/10/2025</p>
                            <p><i class="fas fa-clock"></i> 08:00 - 09:00</p>
                        </div>
                        <div class="reservation-footer">
                            <small>X = cancelar turno</small>
                        </div>
                    </div>
                    
                    <div class="reservation-item">
                        <div class="reservation-header">
                            <h3><i class="fas fa-tennis-ball"></i> Cancha 3</h3>
                            <button class="btn-cancel" onclick="cancelReservation(2)">X</button>
                        </div>
                        <div class="reservation-details">
                            <p><i class="fas fa-calendar-day"></i> 15/10/2025</p>
                            <p><i class="fas fa-clock"></i> 10:00 - 11:00</p>
                        </div>
                        <div class="reservation-footer">
                            <small>X = cancelar turno</small>
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <a href="reservas.html" class="btn btn-primary">
                        <i class="fas fa-home"></i> Volver al inicio
                    </a>
                    <a href="reservas.html" class="btn btn-secondary">
                        <i class="fas fa-calendar-plus"></i> Nueva Reserva
                    </a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2023 Complejo Deportivo. Todos los derechos reservados.</p>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
